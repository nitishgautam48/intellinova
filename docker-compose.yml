# IntelliNova — full stack.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.1:8b
#   docker compose exec ollama ollama pull qwen2.5:7b
#   docker compose exec ollama ollama pull llava:7b
#
# Everything is served through Caddy on http://localhost (or your domain):
#   /            Next.js web app (student app, admin console, landing)
#   /api/*       FastAPI gateway
#   /auth/v1/*   GoTrue (only needed for OAuth callbacks and email links)
#   mail UI      http://localhost:8025 (Mailpit, dev profile only)

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://intellinova:${POSTGRES_PASSWORD}@db:5432/intellinova
  REDIS_URL: redis://redis:6379/0
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  GOTRUE_URL: http://gotrue:9999
  JWT_SECRET: ${JWT_SECRET}
  OLLAMA_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
  VERIFIER_MODEL: ${VERIFIER_MODEL:-qwen2.5:7b}
  VISION_MODEL: ${VISION_MODEL:-llava:7b}
  EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-sentence-transformers}
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
  WHISPER_MODEL: ${WHISPER_MODEL:-small}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
  LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
  RERANK_MODEL: ${RERANK_MODEL-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
  PIPER_VOICE_DIR: /models/piper
  PIPER_AUTO_DOWNLOAD: ${PIPER_AUTO_DOWNLOAD:-true}
  # Evaluation frameworks: no usage telemetry leaves the machine.
  RAGAS_DO_NOT_TRACK: "true"
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  LITELLM_TELEMETRY: "False"
  ANONYMIZED_TELEMETRY: "False"
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
  INVITE_TTL_DAYS: ${INVITE_TTL_DAYS:-7}
  STORAGE_DIR: /data/uploads
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
  DISCOVERY_MIN_VIDEOS: ${DISCOVERY_MIN_VIDEOS:-3}
  DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-5}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-CBSE+JEENEETards+Indian_Academia+IndianStudents+ICSE}
  POSTHOG_HOST: ${POSTHOG_HOST:-}
  POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellinova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: intellinova
      GOTRUE_DB_PASSWORD: ${GOTRUE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellinova -d intellinova"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilidata:/meili_data]

  gotrue:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD}@db:5432/intellinova?search_path=auth
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost}/**
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_MAILER_OTP_LENGTH: 6
      # Emails carry a 6-digit code (the design's verify screen) instead of a magic link.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://api:8000/api/auth/email-templates/confirmation
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://api:8000/api/auth/email-templates/recovery
      GOTRUE_MAILER_TEMPLATES_INVITE: http://api:8000/api/auth/email-templates/invite
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Your IntelliNova code"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your IntelliNova password"
      GOTRUE_MAILER_SUBJECTS_INVITE: "You're invited to the IntelliNova admin console"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-no-reply@intellinova.local}
      GOTRUE_SMTP_SENDER_NAME: IntelliNova
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${RATE_LIMIT_EMAIL_SENT:-30}
      # Mobile-number sign-in (off unless you configure an SMS provider).
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${PHONE_ENABLED:-false}
      GOTRUE_SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      GOTRUE_SMS_OTP_LENGTH: 6
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${TWILIO_MESSAGE_SERVICE_SID:-}
      # "Continue with Google" (off unless you add OAuth credentials).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL:-http://localhost}/auth/v1/callback

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # Uncomment on a machine with an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  api:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_started }
    volumes:
      - uploads:/data/uploads
      - models:/models

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "-Q", "ingest,ai,signal,feedback,eval,default", "--concurrency", "${WORKER_CONCURRENCY:-2}"]
    environment: *backend-env
    depends_on: [api]
    # The image's health check calls the API port, which the worker doesn't serve.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 20 >/dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
    volumes:
      - uploads:/data/uploads
      - models:/models

  beat:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on: [api]
    healthcheck:
      disable: true

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_NAME: IntelliNova
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_API_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, api, gotrue]

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports: ["8025:8025"]

volumes:
  pgdata:
  redisdata:
  meilidata:
  ollama:
  uploads:
  models:
  caddydata:
